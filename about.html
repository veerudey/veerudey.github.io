<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Veerudey</title>
  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #e8f4ff);
      color: #222;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    nav {
      background: #007bff;
      padding: 12px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffeb3b;
      text-decoration: underline;
    }

    /* About Section */
    h1 {
      color: #007bff;
      margin-top: 50px;
      font-size: 2.4rem;
    }

    .about-container {
      background: white;
      border-radius: 12px;
      width: 85%;
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1s ease-in-out;
    }

    .about-container img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid #007bff;
    }

    .about-container p {
      font-size: 1.1rem;
      margin: 10px 0;
      line-height: 1.6;
      color: #333;
    }

    .highlight {
      color: #007bff;
      font-weight: bold;
    }

    /* Button Style */
    .btn {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    footer {
      margin-top: auto;
      background: #007bff;
      color: white;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .about-container p { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>👋 About Me</h1>

  <div class="about-container">
    <img src="profile.jpg" alt="Veerudey Profile"> <!-- optional profile image -->
    <p>Hi, I’m <span class="highlight">Veerudey</span> — I love <b>AI</b>, <b>Virtual Reality</b>, and creating awesome websites 🌐</p>
    <p>This website is made to share knowledge, creativity, and inspire others to explore the world of technology 🚀</p>
    <a href="https://discord.gg/DzjV9R5T" target="_blank" class="btn">Join My Discord 💬</a>
  </div>

</body>
</html>
