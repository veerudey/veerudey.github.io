<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Veerudey</title>

  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: #e8f4ff;
      color: #222;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    nav {
      background: #007bff;
      padding: 12px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ffeb3b;
      text-decoration: underline;
    }

    h1 {
      margin-top: 40px;
      color: #007bff;
      font-size: 2.5rem;
    }

    .contact-box {
      background: white;
      max-width: 450px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .contact-box p {
      font-size: 1.1rem;
      margin: 15px 0;
    }

    .contact-info {
      margin-top: 20px;
      background: #f0f7ff;
      padding: 15px;
      border-radius: 10px;
    }

    .contact-info strong {
      color: #007bff;
    }

    a.discord-btn {
      display: inline-block;
      background: #5865F2;
      color: white;
      padding: 12px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.3s;
    }

    a.discord-btn:hover {
      background: #4752c4;
    }

    footer {
      background: #007bff;
      color: white;
      padding: 10px;
      margin-top: 40px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      .contact-box {
        width: 90%;
      }
    }
  </style>
</head>

<body>
