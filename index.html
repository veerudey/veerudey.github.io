<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Veerudey</title>
  <style>
    :root{
      --bg: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
      --card:#ffffffcc;
      --accent:#007bff;
      --muted:#37474f;
      --glass: rgba(255,255,255,0.4);
      --radius:14px;
      --maxw:980px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Poppins", "Segoe UI", Roboto, sans-serif;
      background:var(--bg);
      color:#0d1b2a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 20px;
    }

    .site {
      width:100%;
      max-width:var(--maxw);
      background: var(--card);
      border-radius:18px;
      padding:28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:22px;
      align-items:start;
      backdrop-filter: blur(10px);
    }

    .hero { padding-right:6px; }
    .title {
      font-size:24px;
      margin:0 0 6px 0;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .byline {
      font-size:14px;
      color:var(--muted);
      margin:0 0 16px 0;
    }
    .lead {
      background: var(--glass);
      padding:14px 16px;
      border-radius:12px;
      margin-bottom:16px;
      font-size:16px;
      color:#0d47a1;
      font-weight:500;
    }

    .cta-row {
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      gap:10px;
      background: linear-gradient(90deg, #2196f3, #64b5f6);
      color:white;
      padding:10px 16px;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      box-shadow: 0 8px 20px rgba(33,150,243,0.3);
      border: none;
      cursor:pointer;
      transition:0.3s;
    }
    .btn:hover {
      transform:translateY(-2px);
      box-shadow: 0 10px 24px rgba(33,150,243,0.4);
    }

    .panel {
      background: rgba(255,255,255,0.7);
      padding:16px;
      border-radius:12px;
      min-height:120px;
      text-align:center;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }
    .panel h2 {
      margin:6px 0 10px 0;
      font-size:16px;
      color:#0d47a1;
    }
    .panel p {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .ai-card{
      margin-top:6px;
      background: rgba(255,255,255,0.8);
