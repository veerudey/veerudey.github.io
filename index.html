<!DOCTYPE html>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',Arial,sans-serif;
  background:#C7C2BF;
  color:#222;
  text-align:center;
  overflow-x:hidden;
}

nav{
  background:#000;
  padding:12px 0;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 15px;
  font-weight:bold;
}

nav a:hover{
  color:#00aaff;
}

/* HERO */
.hero{
  background:#111;
  color:white;
  padding:80px 10%;
}

.hero-content{
  display:flex;
  justify-content:space-between; /* 🔥 LEFT + RIGHT */
  align-items:center;
  flex-wrap:wrap;
}

.hero h1{
  font-size:3rem;
  text-align:left;
}

/* AUTHOR RIGHT */
.author{
  display:flex;
  align-items:center;
  gap:12px;
}

.author img{
  width:60px;
  height:60px;
  border-radius:50%;
  border:3px solid #007bff;
}

.author span{
  color:#00aaff;
  font-weight:600;
  font-size:1.1rem;
}

/* REST SAME */
h2{
  margin-top:25px;
  color:#007bff;
}

img{
  width:90%;
  max-width:350px;
  border-radius:10px;
  margin:10px auto;
}

p{
  width:90%;
  max-width:700px;
  margin:10px auto;
  line-height:1.5;
}

.btn{
  display:inline-block;
  background:#5865F2;
  color:white;
  padding:10px 20px;
  margin-top:15px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

footer{
  background:#050505;
  color:white;
  padding:10px;
  margin-top:20px;
}

/* MOBILE FIX */
@media(max-width:768px){
  .hero-content{
    flex-direction:column;
    align-items:flex-start;
  }

  .author{
    margin-top:15px;
  }
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>

    <h1>Welcome to my website 🌐</h1>
