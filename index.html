<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veerudey Website-about-AI</title>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f4ff;
      color: #222;
      text-align: center;
    }
    header {
      background: #007bff;
      color: white;
      padding: 20px 10px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: bold;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 30px;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 300px;
      padding: 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    /* ---- Button ---- */
    .btn {
      display: inline-block;
      background: #5865F2;
      color: white;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4752c4;
    }

    /* ---- Footer ---- */
    footer {
      background: #007bff;
      color: white;
      padding: 10px;
      margin-top: 20px;
      font-size: 14px;
    }

    /* ---- Responsive Design ---- */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.6rem;
      }
      .container {
        flex-direction: column;
      }
      .card {
        width: 90%;
      }
    }
</head>

  <h2>🧠 What is AI?</h2>
  <img src="wia.jpg" alt="My Image" width="300">
  <p> AI stands for <strong>Artificial Intelligence</strong> — it means giving machines or computers the ability to think and learn like humans.
    AI allows systems to understand, reason, and make decisions automatically.</p>
 <p>_______________</p>
  <h2>🕶️ Virtual Reality</h2>
    <img src="VR.jpeg" alt="VR Image" width="300">
  <p><i>Virtual Reality (VR) a technology that creates a fully immersive, computer-generated environment that users can interact with.</i></p>
<p>Users wear VR headset that block out the real world and replace it with a digital environment, giving the sensation of being in a different place or 
  world. They can interact with the virtual environment using controllers or body movement, enhancing the feeling of presence within the digital world. 
  This technology is often used in gaming, simulations, and training applications.</p>
 <p>_______________</p>
  <h2>Where is Virtual Reality Being Used</h2>
  <img src="GAMING.jpeg" alt="Gaming Image" width="300">
  <p><b>Gaming:</b> VR is used for bewitching gaming experiences. You can put on a VR headset and feel as if you are inside the game, whether it's exploring
  magical worlds, solving puzzels, or battling virtual monsters.</p>
 <p>_______________</p>
